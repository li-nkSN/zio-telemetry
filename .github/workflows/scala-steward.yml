name: Scala Steward

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Scala Steward
        uses: scala-steward-org/scala-steward-action@v2.76.0
        with:
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN }}
          branches: main
